name: Profile

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.json
      - package.json
      - .github/scripts/**
      - .github/assets/fonts/**

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Skip without token
        if: env.METRICS_TOKEN == ''
        run: echo "::notice::Секрет METRICS_TOKEN не задан — профиль не перегенерирован. Без него не видны приватные репозитории."

      - uses: actions/checkout@v4
        if: env.METRICS_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.METRICS_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - name: Render
        if: env.METRICS_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          npm ci
          npm run build

      - name: Commit
        if: env.METRICS_TOKEN != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/assets/*.svg
          git diff --staged --quiet || (git commit -m "Update profile stats" && git push)
